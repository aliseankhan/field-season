<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stroud Lab: Field Season</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/ui/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="ui"></div>
<div id="loading" role="status">
  <div class="loading-leaf"></div>
  <div class="loading-text">Heading out to the island</div>
</div>
<pre id="diag" hidden></pre>
<script>
  // Errors before the modules run (for example a failed import) still reach ?diag=1.
  window.__earlyErrors = [];
  window.addEventListener('error', function (e) { window.__earlyErrors.push(String(e.message || e)); });
  function bootFailed(msg) {
    window.__earlyErrors.push(msg);
    document.getElementById('diag').textContent = JSON.stringify({ ok: false, errors: window.__earlyErrors });
    document.querySelector('#loading .loading-text').textContent = 'The island could not be loaded.';
  }
</script>
<script type="module" src="src/main.js" onerror="bootFailed('main.js failed to load')"></script>
</body>
</html>
