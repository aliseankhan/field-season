const rowX = {};

function label(text, sub, x, y, z) {
  const d = document.createElement('div');
  d.className = 'tag';
  d.innerHTML = sub ? `${text}<small>${sub}</small>` : text;
  const o = new CSS2DObject(d);
  o.position.set(x, y, z);
  scene.add(o);
}

function unit(key, x, y, z, sx, sy, sz, col = [1, 1, 1], rot = 0.4) {
  const { geometry, mat } = makeUnitGeometry(key);
  const m = new THREE.InstancedMesh(geometry, mats[mat], 1);
  m.setMatrixAt(0, new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rot, 0)), new THREE.Vector3(sx, sy, sz)));
  m.setColorAt(0, new THREE.Color(col[0], col[1], col[2]));
  m.castShadow = m.receiveShadow = true;
  m.computeBoundingSphere();
  scene.add(m);
}

// Lay models out left to right along a row; each entry gives its footprint width.
function row(name, entries) {
  if (Q.get('row') && Q.get('row') !== name) return;
  const z = rows[name];
  const total = entries.reduce((s, e) => s + e.w, 0);
  let x = -total / 2;
  for (const e of entries) {
    const cx = x + e.w / 2;
    e.make(cx, z);
    label(e.label, e.sub, cx, (e.h ?? 3) + 0.8, z);
    x += e.w;
  }
  rowX[name] = total;
}

// a small mound of four puffs sharing one envelope, as the vegetation draws them
function mound(x, z, list, col) {
  const env = (p) => {
    let gx = 0, gz = 0;
    for (const q of list) {
      const d = Math.hypot(p[0] - (x + q[0]), p[2] - (z + q[1])) / q[2];
      if (d < 1) { const k = q[3] * d / Math.sqrt(1 - d * d + 1e-3) / q[2]; gx += k * (p[0] - x - q[0]) / (d * q[2] + 1e-3); gz += k * (p[2] - z - q[1]) / (d * q[2] + 1e-3); }
    }
    const l = Math.hypot(gx, 1, gz);
    return [gx / l * 0.6, 1 / l, gz / l * 0.6];
  };
  const top = Math.max(...list.map((q) => q[3]));
  list.forEach((q, i) => moundPuff(leaf, { x: x + q[0], y0: 0, z: z + q[1], R: q[2], H: q[3], color: col, seed: 40 + i, env, massTop: top, jit: 0.02, detail: q[2] > 1.4 ? 2 : 1 }));
}

for (const [b, mat] of [[wood, mats.wood], [leaf, mats.leaf], [props, propMat]]) {
  if (!b.triangles) continue;
  const m = new THREE.Mesh(b.toGeometry(), mat);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.2, 800);
const controls = new OrbitControls(camera, renderer.domElement);
const r = Q.get('row');
if (Q.get('cam')) {
  const c = Q.get('cam').split(',').map(Number);
  camera.position.set(c[0], c[1], c[2]);
  controls.target.set(c[3], c[4], c[5]);
} else if (r && rows[r] != null) {
  const w = rowX[r];
  const h = { A: 9, B: 5, C: 3, D: 1.6, E: 0.9 }[r];
  const d = 0.6 * w;
  camera.position.set(0, h * 0.5 + d * 0.12, rows[r] + d);
  controls.target.set(0, h * 0.5, rows[r]);
} else {
  camera.position.set(0, 60, 165);
  controls.target.set(0, 4, 30);
}
controls.update();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labels.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  setVegFrame(clock.getElapsedTime());
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});
</script>
</body>
